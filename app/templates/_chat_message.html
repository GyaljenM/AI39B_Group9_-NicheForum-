<div data-msg class="chat-msg {% if m.sender_id == session.get('user_id') %}mine{% else %}theirs{% endif %}">
    <div class="chat-bubble">
        {% if m.share_type %}
            <a href="{{ m.share_url }}" class="chat-share-card">
                <span class="material-symbols-outlined text-base">{% if m.share_type == 'live' %}sensors{% else %}edit_note{% endif %}</span>
                {{ m.share_label }}
            </a>
        {% else %}
            {{ m.content }}
        {% endif %}
    </div>
    <span class="chat-time">{{ m.created_at.strftime('%H:%M') if m.created_at else '' }}</span>
</div>
