{% extends "base.html" %}

{% block title %}Edit Post | NicheForum{% endblock %}

{% block content %}
<div class="max-w-[900px] mx-auto px-6 py-12">
    <h2 class="text-2xl font-bold mb-6">Edit Post</h2>
    <form action="{{ url_for('Home.edit_post', post_id=post.id) }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1 text-on-surface-variant">Title</label>
            <input name="title" type="text" value="{{ post.title }}" class="w-full rounded border-slate-200 focus:ring-primary focus:border-primary px-4 py-3" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1 text-on-surface-variant">Content</label>
            <textarea name="content" rows="8" class="w-full rounded-2xl border-slate-200 focus:ring-primary focus:border-primary p-6" {% if post.post_type == 'text' %}required{% endif %}>{{ post.content }}</textarea>
            {% if post.post_type != 'text' %}
            <p class="text-sm text-slate-500 mt-2">Leave this empty if you want the media or poll content to remain unchanged.</p>
            {% endif %}
        </div>
        <div class="flex gap-3">
            <button type="submit" class="px-6 py-3 bg-primary text-white rounded">Save Changes</button>
            <a href="{{ url_for('Home.community_detail', community_id=post.community_id) }}" class="px-6 py-3 bg-surface-bright rounded-xl">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
