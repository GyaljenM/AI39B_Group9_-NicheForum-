{% extends "base.html" %}
{% block title %}Login - NicheForum{% endblock %}

{% block styles %}
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    "primary": "#C2410C",
                    "primary-hover": "#9a3412",
                    "surface": "#FFFFFF",
                    "muted": "#78716C",
                    "forum-bg": "#F8F6F1",
                    "border": "#E5E3DE",
                },
                fontFamily: {
                    "sans": ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
                }
            }
        }
    }
</script>
{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-6 py-12 bg-[#F8F6F1]">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-semibold text-[#C2410C] mb-2">NicheForum</h1>
            <p class="text-[#78716C] text-sm">Welcome back! Please login to your account.</p>
        </div>

        <div class="bg-white rounded p-6 border border-[#E5E3DE]">
            <form method="POST" action="{{ url_for('Auth.login') }}" class="space-y-6">
                <div>
                    <label for="email" class="block text-xs font-medium text-[#78716C] mb-2">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#78716C] text-lg">mail</span>
                        <input type="email" id="email" name="email" required 
                            class="w-full pl-10 pr-4 py-3 bg-[#F8F6F1] border border-[#E5E3DE] rounded focus:outline-none focus:border-[#C2410C] transition-colors"
                            placeholder="name@gmail.com">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="text-xs font-medium text-[#78716C]">Password</label>
                        <a href="{{ url_for('Auth.forgot_password') }}" class="text-xs font-medium text-[#C2410C] hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#78716C] text-lg">lock</span>
                        <input type="password" id="password" name="password" required 
                            class="w-full pl-10 pr-4 py-3 bg-[#F8F6F1] border border-[#E5E3DE] rounded focus:outline-none focus:border-[#C2410C] transition-colors"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-[#C2410C] border-[#E5E3DE] rounded">
                    <label for="remember" class="ml-2 text-sm text-[#78716C] font-medium">Remember me</label>
                </div>

                <button type="submit" 
                    class="w-full py-3 bg-[#C2410C] hover:bg-[#9a3412] text-white rounded text-sm font-medium transition-colors">
                    Login
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-[#E5E3DE] text-center">
                <p class="text-sm text-[#78716C] font-medium">
                    Don't have an account? 
                    <a href="{{ url_for('Auth.register') }}" class="text-[#C2410C] font-semibold hover:underline">Sign up for free</a>
                </p>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="{{ url_for('Home.home') }}" class="inline-flex items-center text-sm font-medium text-[#78716C] hover:text-[#1C1917] transition-colors">
                <span class="material-symbols-outlined mr-2 text-base">arrow_left</span>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
