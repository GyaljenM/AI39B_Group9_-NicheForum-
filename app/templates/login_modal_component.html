<!-- Login Modal Structure -->
<div id="loginModal" class="login-modal-overlay" style="display: none;">
    <div class="login-modal-backdrop" onclick="closeLoginModal()"></div>
    <div class="login-modal-container">
        <!-- Close Icon -->
        <button class="login-modal-close" onclick="closeLoginModal()">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="login-modal-content">
            <div class="login-modal-header">
                <div class="login-modal-logo">
                    <div class="login-modal-logo-icon">
                        <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings:'FILL' 1;">forum</span>
                    </div>
                </div>
                <h2>Welcome Back</h2>
                <p>Enter your credentials to sign in</p>
            </div>

            <!-- Form -->
            <form action="{{ url_for('Auth.login') }}" method="POST" class="login-form">
                <div class="form-group">
                    <label for="modal-email">Email Address</label>
                    <div class="login-input-wrap">
                        <span class="material-symbols-outlined login-input-icon">mail</span>
                        <input type="email" id="modal-email" name="email" placeholder="name@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="modal-password">Password</label>
                        <a href="{{ url_for('Auth.forgot_password') }}" class="forgot-link">Forgot?</a>
                    </div>
                    <div class="login-input-wrap">
                        <span class="material-symbols-outlined login-input-icon">lock</span>
                        <input type="password" id="modal-password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="login-submit-btn">
                    <span class="material-symbols-outlined text-lg">login</span>
                    Sign In
                </button>
            </form>

            <div class="login-modal-footer">
                <p>Don't have an account? <a href="{{ url_for('Auth.register') }}">Create account</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* ═══ Login Modal Styles ═══ */
.login-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.login-modal-container {
    position: relative;
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 28px;
    box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.2);
    padding: 40px;
    margin: 20px;
    animation: loginModalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes loginModalIn {
    from { transform: scale(0.92) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Close Button */
.login-modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #F5F5F4;
    border: none;
    cursor: pointer;
    color: #78716C;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-modal-close:hover {
    background: #E7E5E4;
    color: #1C1917;
    transform: rotate(90deg);
}

/* Header */
.login-modal-header {
    text-align: center;
    margin-bottom: 28px;
}

.login-modal-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.login-modal-logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #C2410C, #EA580C);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(194, 65, 12, 0.3);
}

.login-modal-header h2 {
    font-size: 26px;
    font-weight: 800;
    color: #1C1917;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
}

.login-modal-header p {
    color: #78716C;
    font-size: 14px;
    font-weight: 500;
}

/* Form Styles */
.login-form .form-group {
    margin-bottom: 18px;
}

.login-form label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #44403C;
    margin-bottom: 6px;
    margin-left: 2px;
    letter-spacing: 0.02em;
}

.label-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot-link {
    font-size: 12px;
    font-weight: 600;
    color: #C2410C;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

/* Input styling */
.login-input-wrap {
    position: relative;
}

.login-input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #A8A29E;
    font-size: 18px;
    pointer-events: none;
}

.login-form input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 1.5px solid #E7E5E4;
    border-radius: 14px;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
    box-sizing: border-box;
    background: #FAFAF9;
}

.login-form input::placeholder {
    color: #D6D3D1;
}

.login-form input:focus {
    border-color: #C2410C;
    box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.08);
    background: white;
}

/* Submit button */
.login-submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #C2410C, #EA580C);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
}

.login-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(194, 65, 12, 0.35);
}

.login-submit-btn:active {
    transform: scale(0.98);
}

/* Footer */
.login-modal-footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #E7E5E4;
    font-size: 13px;
    color: #78716C;
}

.login-modal-footer a {
    color: #C2410C;
    font-weight: 700;
    text-decoration: none;
}

.login-modal-footer a:hover {
    text-decoration: underline;
}
</style>

<script>
function openLoginModal() {
    document.getElementById('loginModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeLoginModal() {
    document.getElementById('loginModal').style.display = 'none';
    document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLoginModal();
});
</script>
