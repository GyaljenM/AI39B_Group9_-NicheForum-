<!-- Login Modal Structure -->
<div id="loginModal" class="login-modal-overlay" style="display: none;">
    <div class="login-modal-backdrop" onclick="closeLoginModal()"></div>
    <div class="login-modal-container">
        <!-- Close Icon -->
        <button class="login-modal-close" onclick="closeLoginModal()">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="login-modal-content">
            <div class="login-modal-header">
                <h2>Welcome Back</h2>
                <p>Please enter your details to sign in</p>
            </div>

            <!-- Social Login (Google Only) -->
            <div class="social-login-section">
                <button class="google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <div class="divider">
                <span>or sign in with email</span>
            </div>

            <!-- Form -->
            <form action="/login" method="POST" class="login-form">
                <div class="form-group">
                    <label for="modal-email">Email Address</label>
                    <input type="email" id="modal-email" name="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="modal-password">Password</label>
                        <a href="/forgot-password" class="forgot-link">Forgot?</a>
                    </div>
                    <input type="password" id="modal-password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="login-modal-footer">
                <p>Don't have an account? <a href="/register">Create an account</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* Modal Base Styles */
.login-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-modal-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
}

.login-modal-container {
    position: relative;
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    padding: 40px;
    margin: 20px;
    animation: modalScaleIn 0.3s ease-out;
}

@keyframes modalScaleIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* Close Button */
.login-modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    cursor: pointer;
    color: #94a3b8;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-modal-close:hover {
    background: #f1f5f9;
    color: #475569;
}

/* Header */
.login-modal-header {
    text-align: center;
    margin-bottom: 32px;
}

.login-modal-header h2 {
    font-size: 28px;
    font-weight: 800;
    color: #463acb;
    margin-bottom: 8px;
    font-family: 'Lexend', sans-serif;
}

.login-modal-header p {
    color: #64748b;
    font-weight: 500;
}

/* Google Button */
.google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: white;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    transition: background 0.2s;
}

.google-btn:hover {
    background: #f8fafc;
}

/* Divider */
.divider {
    position: relative;
    text-align: center;
    margin: 24px 0;
}

.divider::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background: #e2e8f0;
}

.divider span {
    position: relative;
    background: white;
    padding: 0 16px;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
}

/* Form Styles */
.login-form .form-group {
    margin-bottom: 20px;
}

.login-form label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
    margin-left: 4px;
}

.label-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot-link {
    font-size: 13px;
    font-weight: 600;
    color: #463acb;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

.login-form input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
}

.login-form input:focus {
    border-color: #463acb;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: #463acb;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    margin-top: 8px;
}

.submit-btn:hover {
    background: #4338ca;
}

.submit-btn:active {
    transform: scale(0.98);
}

/* Footer */
.login-modal-footer {
    text-align: center;
    margin-top: 32px;
    font-size: 14px;
    color: #64748b;
}

.login-modal-footer a {
    color: #463acb;
    font-weight: 700;
    text-decoration: none;
}

.login-modal-footer a:hover {
    text-decoration: underline;
}
</style>

<script>
/**
 * Shows the login modal and disables body scrolling
 */
function openLoginModal() {
    const modal = document.getElementById('loginModal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

/**
 * Hides the login modal and restores body scrolling
 */
function closeLoginModal() {
    const modal = document.getElementById('loginModal');
    modal.style.display = 'none';
    document.body.style.overflow = '';
}

// Optional: Close modal when pressing 'Escape' key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeLoginModal();
    }
});
</script>
