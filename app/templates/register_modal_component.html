<!-- Register Modal Structure -->
<div id="registerModal" class="register-modal-overlay" style="display: none;">
    <div class="register-modal-backdrop" onclick="closeRegisterModal()"></div>
    <div class="register-modal-container">
        <!-- Close Icon -->
        <button class="register-modal-close" onclick="closeRegisterModal()">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="register-modal-content">
            <div class="register-modal-header">
                <div class="register-modal-logo">
                    <div class="register-modal-logo-icon">
                        <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings:'FILL' 1;">forum</span>
                    </div>
                </div>
                <h2>Join NicheForum</h2>
                <p>Create your account and start sharing</p>
            </div>

            <!-- Form -->
            <form action="{{ url_for('Auth.register') }}" method="POST" class="register-form">
                <div class="form-group">
                    <label for="modal-register-name">Full Name</label>
                    <div class="register-input-wrap">
                        <span class="material-symbols-outlined register-input-icon">person</span>
                        <input type="text" id="modal-register-name" name="name" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="modal-register-email">Email Address</label>
                    <div class="register-input-wrap">
                        <span class="material-symbols-outlined register-input-icon">mail</span>
                        <input type="email" id="modal-register-email" name="email" placeholder="name@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="modal-register-password">Password</label>
                    <div class="register-input-wrap">
                        <span class="material-symbols-outlined register-input-icon">lock</span>
                        <input type="password" id="modal-register-password" name="password" placeholder="••••••••" required>
                    </div>
                    <p class="field-hint">Minimum 8 characters</p>
                </div>
                
                <div class="terms-group">
                    <input type="checkbox" id="modal-terms" name="terms" required>
                    <label for="modal-terms">I agree to the <a href="#">Terms of Service</a></label>
                </div>

                <button type="submit" class="register-submit-btn">
                    <span class="material-symbols-outlined text-lg">person_add</span>
                    Create Account
                </button>
            </form>

            <div class="register-modal-footer">
                <p>Already have an account? <a href="javascript:void(0)" onclick="switchToLogin()">Sign In</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* ═══ Register Modal Styles ═══ */
.register-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1001;
    display: flex;
    align-items: center;
    justify-content: center;
}

.register-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.register-modal-container {
    position: relative;
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 28px;
    box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.2);
    padding: 32px 40px;
    margin: 20px;
    animation: registerModalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes registerModalIn {
    from { transform: scale(0.92) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Close Button */
.register-modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #F5F5F4;
    border: none;
    cursor: pointer;
    color: #78716C;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.register-modal-close:hover {
    background: #E7E5E4;
    color: #1C1917;
    transform: rotate(90deg);
}

/* Header */
.register-modal-header {
    text-align: center;
    margin-bottom: 24px;
}

.register-modal-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
}

.register-modal-logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #C2410C, #EA580C);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(194, 65, 12, 0.3);
}

.register-modal-header h2 {
    font-size: 26px;
    font-weight: 800;
    color: #1C1917;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
}

.register-modal-header p {
    color: #78716C;
    font-weight: 500;
    font-size: 14px;
}

/* Form Styles */
.register-form .form-group {
    margin-bottom: 16px;
}

.register-form label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #44403C;
    margin-bottom: 6px;
    margin-left: 2px;
    letter-spacing: 0.02em;
}

/* Input styling */
.register-input-wrap {
    position: relative;
}

.register-input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #A8A29E;
    font-size: 18px;
    pointer-events: none;
}

.register-form input:not([type="checkbox"]) {
    width: 100%;
    padding: 11px 16px 11px 44px;
    border: 1.5px solid #E7E5E4;
    border-radius: 14px;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
    box-sizing: border-box;
    background: #FAFAF9;
}

.register-form input:not([type="checkbox"])::placeholder {
    color: #D6D3D1;
}

.register-form input:not([type="checkbox"]):focus {
    border-color: #C2410C;
    box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.08);
    background: white;
}

.field-hint {
    font-size: 11px;
    color: #A8A29E;
    margin-top: 4px;
    margin-left: 4px;
    font-style: italic;
}

/* Terms */
.terms-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
}

.terms-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #C2410C;
    cursor: pointer;
}

.terms-group label {
    margin: 0;
    font-size: 12px;
    color: #78716C;
    font-weight: 500;
}

.terms-group a {
    color: #C2410C;
    font-weight: 700;
    text-decoration: none;
}

/* Submit button */
.register-submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #C2410C, #EA580C);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.register-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(194, 65, 12, 0.35);
}

.register-submit-btn:active {
    transform: scale(0.98);
}

/* Footer */
.register-modal-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #E7E5E4;
    font-size: 13px;
    color: #78716C;
}

.register-modal-footer a {
    color: #C2410C;
    font-weight: 700;
    text-decoration: none;
}

.register-modal-footer a:hover {
    text-decoration: underline;
}
</style>

<script>
function openRegisterModal() {
    var loginModal = document.getElementById('loginModal');
    if (loginModal) loginModal.style.display = 'none';
    document.getElementById('registerModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeRegisterModal() {
    document.getElementById('registerModal').style.display = 'none';
    document.body.style.overflow = '';
}

function switchToLogin() {
    closeRegisterModal();
    if (typeof openLoginModal === 'function') {
        setTimeout(openLoginModal, 100);
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeRegisterModal();
});
</script>
