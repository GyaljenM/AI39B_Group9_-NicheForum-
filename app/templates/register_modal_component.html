<!-- Register Modal Structure -->
<div id="registerModal" class="register-modal-overlay" style="display: none;">
    <div class="register-modal-backdrop" onclick="closeRegisterModal()"></div>
    <div class="register-modal-container">
        <!-- Close Icon -->
        <button class="register-modal-close" onclick="closeRegisterModal()">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="register-modal-content">
            <div class="register-modal-header">
                <h2>Join NicheForum</h2>
                <p>Create your account and start sharing</p>
            </div>

            <!-- Social Signup (Google Only) -->
            <div class="social-login-section">
                <button class="google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign up with Google
                </button>
            </div>

            <div class="divider">
                <span>or use your email</span>
            </div>

            <!-- Form -->
            <form action="/register" method="POST" class="register-form">
                <div class="form-group">
                    <label for="modal-register-name">Full Name</label>
                    <input type="text" id="modal-register-name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="modal-register-email">Email Address</label>
                    <input type="email" id="modal-register-email" name="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="modal-register-password">Password</label>
                    <input type="password" id="modal-register-password" name="password" placeholder="••••••••" required>
                    <p class="field-hint">Minimum 8 characters</p>
                </div>
                
                <div class="terms-group">
                    <input type="checkbox" id="modal-terms" name="terms" required>
                    <label for="modal-terms">I agree to the <a href="#">Terms of Service</a></label>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <div class="register-modal-footer">
                <p>Already have an account? <a href="javascript:void(0)" onclick="switchToLogin()">Sign In</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* Modal Base Styles (Uniquely scoped or shared via common classes if refactored) */
.register-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1001; /* Slightly higher than login just in case */
    display: flex;
    align-items: center;
    justify-content: center;
}

.register-modal-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
}

.register-modal-container {
    position: relative;
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    padding: 32px 40px;
    margin: 20px;
    animation: modalScaleIn 0.3s ease-out;
}

/* Close Button */
.register-modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    cursor: pointer;
    color: #94a3b8;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.register-modal-close:hover {
    background: #f1f5f9;
    color: #475569;
}

/* Header */
.register-modal-header {
    text-align: center;
    margin-bottom: 24px;
}

.register-modal-header h2 {
    font-size: 28px;
    font-weight: 800;
    color: #4f46e5;
    margin-bottom: 4px;
    font-family: 'Lexend', sans-serif;
}

.register-modal-header p {
    color: #64748b;
    font-weight: 500;
    font-size: 14px;
}

/* Form Styles */
.register-form .form-group {
    margin-bottom: 16px;
}

.register-form label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
    margin-left: 4px;
}

.register-form input:not([type="checkbox"]) {
    width: 100%;
    padding: 10px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
}

.register-form input:not([type="checkbox"]):focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
}

.field-hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
    margin-left: 4px;
    font-style: italic;
}

.terms-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
}

.terms-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #4f46e5;
    cursor: pointer;
}

.terms-group label {
    margin: 0;
    font-size: 12px;
    color: #64748b;
    font-weight: 500;
}

.terms-group a {
    color: #4f46e5;
    font-weight: 700;
    text-decoration: none;
}

/* Footer */
.register-modal-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: #64748b;
}

.register-modal-footer a {
    color: #4f46e5;
    font-weight: 700;
    text-decoration: none;
}
</style>

<script>
/**
 * Shows the register modal and disables body scrolling
 */
function openRegisterModal() {
    // Close login modal if it's open
    const loginModal = document.getElementById('loginModal');
    if (loginModal) loginModal.style.display = 'none';

    const modal = document.getElementById('registerModal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

/**
 * Hides the register modal and restores body scrolling
 */
function closeRegisterModal() {
    const modal = document.getElementById('registerModal');
    modal.style.display = 'none';
    document.body.style.overflow = '';
}

/**
 * Switch from Register to Login
 */
function switchToLogin() {
    closeRegisterModal();
    if (typeof openLoginModal === 'function') {
        setTimeout(openLoginModal, 100);
    }
}

// Optional: Close modal when pressing 'Escape' key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeRegisterModal();
    }
});
</script>
