{% extends "base.html" %}
{% block title %}Verify Account - NicheForum{% endblock %}
{% block content %}
    <h2>Verify Your Account</h2>
    <p>Please type the 6-digit code printed in your Python console.</p>
    
    <form method="POST" action="/verify-otp" style="margin-top: 20px;">
        <input type="hidden" name="email" value="{{ email }}">
        
        <input type="text" id="otp" name="otp" maxlength="6" pattern="\d{6}" required placeholder="000000">
        
        <button type="submit">Verify Code</button>
    </form>
{% endblock %}
