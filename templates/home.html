{% extends "base.html" %}
{% block content %}
<h1>hello {{name}}</h1>

<div style="background-color: red; margin: 5px; border: 2px solid black;">
    <ul>
        {% for pro in products %}
        <li>
            <img src="{{ url_for('static', filename='images/image.png') }}" height="20" width="20">
            {{pro.price}}
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
