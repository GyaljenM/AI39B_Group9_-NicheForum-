<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ thread.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <a href="{{ url_for('home') }}" class="btn btn-secondary mb-3">← Back to Forum</a>
    
    <div class="card mb-4">
        <div class="card-body">
            <h1 class="card-title">{{ thread.title }}</h1>
            <h6 class="card-subtitle mb-2 text-muted">By {{ thread.user_email }} | {{ thread.created_at }}</h6>
            <p class="card-text fs-5">{{ thread.content }}</p>
        </div>
    </div>

    <h3>Replies</h3>
    <div class="list-group mb-4">
        {% for reply in replies %}
            <div class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1 text-primary">{{ reply.user_email }}</h6>
                    <small class="text-muted">{{ reply.created_at }}</small>
                </div>
                <p class="mb-1">{{ reply.content }}</p>
            </div>
        {% else %}
            <p class="text-muted">No replies yet. Be the first to comment!</p>
        {% endfor %}
    </div>

    <div class="card p-3">
        <h5>Leave a Reply</h5>
        <form action="{{ url_for('view_thread', thread_id=thread.id) }}" method="POST">
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="3" placeholder="Write your reply here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Reply</button>
        </form>
    </div>
</body>
</html>
